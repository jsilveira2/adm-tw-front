<div class="grid">
    <div class="col-12">
        <div class="card p-fluid">
            <h5>Cadastro de Papéis</h5>

            <div class="p-fluid p-formgrid grid" [formGroup]="form">
                <div class="field col-12 md:col-6">
                    <label htmlFor="name" class="required">Nome</label>
                    <input formControlName="name" pInputText id="name" type="text" />
                    <p-message *ngIf="form.get('name')?.invalid && form.get('name')?.touched" severity="error"
                        text="Campo obrigatório"></p-message>
                </div>

                <div class="field col-12 md:col-6">
                    <label htmlFor="codeName" class="required">Código</label>
                    <input formControlName="codeName" pInputText id="codeName" type="text" />
                    <p-message *ngIf="form.get('codeName')?.invalid && form.get('codeName')?.touched" severity="error"
                        text="Campo obrigatório"></p-message>
                </div>

                <div class="field col-12 md:col-2">
                    <p-button (click)="save()" label="Salvar" icon="pi pi-save"></p-button>
                </div>
            </div>
        </div>
    </div>
</div>
