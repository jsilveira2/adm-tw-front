<div class="grid">
    <div class="col-12">
        <div class="card p-fluid">
            <h5>Permissões do Usuário</h5>

            <div class="p-fluid p-formgrid grid">
                <div class="field col-12 md:col-6">
                    <label htmlFor="user" class="required">Usuário</label>
                    <p-dropdown [options]="userList" optionValue="id" [filter]="true" filterBy="name"
                        [virtualScroll]="true" [virtualScrollItemSize]="38" id="user" placeholder="Selecione o Usuário"
                        (onChange)="changeUser($event.value)" [(ngModel)]="selectedUserId" [disabled]="disableUserSelect">
                        <ng-template pTemplate="selectedItem" let-selectedOption>
                            <div class="flex align-items-center gap-2">
                                <div>{{ selectedOption.name }} - {{ selectedOption.email }}</div>
                            </div>
                        </ng-template>

                        <ng-template let-user pTemplate="item">
                            <div class="flex align-items-center gap-2">
                                <div>{{ user.name }} - {{ user.email }}</div>
                            </div>
                        </ng-template>
                    </p-dropdown>
                </div>

                <div class="field col-12">
                    <p-pickList [source]="roleList" [target]="userRoleList" sourceHeader="Papéis disponíveis"
                        targetHeader="Papéis do usuário" [dragdrop]="true" [responsive]="true"
                        [sourceStyle]="{ height: '30rem' }" [targetStyle]="{ height: '30rem' }" filterBy="name"
                        sourceFilterPlaceholder="Pesquisar" targetFilterPlaceholder="Pesquisar">
                        <ng-template let-role pTemplate="item">
                            <div class="flex flex-wrap p-2 align-items-center gap-3">
                                <div class="flex-1 flex flex-column gap-2">
                                    <span class="font-bold">
                                        {{ role.name }}
                                    </span>
                                    <div class="flex align-products-center gap-2">
                                        <i class="pi pi-tag text-sm"></i>
                                        <span>
                                            {{ role.codeName }}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </ng-template>
                    </p-pickList>
                </div>

                <div class="field col-12 md:col-2">
                    <p-button (click)="save()" label="Salvar" icon="pi pi-save"></p-button>
                </div>
            </div>
        </div>
    </div>
</div>
